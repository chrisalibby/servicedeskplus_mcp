[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "servicedeskplus-mcp"
version = "0.1.0"
description = "MCP server for ManageEngine ServiceDesk Plus On-Premise"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Chris Libby" }]
classifiers = ["License :: OSI Approved :: Apache Software License"]
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
sdp-mcp = "servicedeskplus_mcp.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
    "ruff>=0.4.0",
    "pyright>=1.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/servicedeskplus_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: live SDP server required (deselected by default)"]
addopts = "-m 'not integration'"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.pyright]
pythonVersion = "3.11"
include = ["src"]
strict = ["src"]
# @app.tool() decorators consume the inner functions; pyright can't see that.
reportUnusedFunction = "none"
